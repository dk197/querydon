name: querydon

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-shop}
            POSTGRES_USER: ${POSTGRES_USER:-querydon}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-querydon}
            # Read by db/init/02_roles.sh
            QUERYDON_READER_PASSWORD: ${QUERYDON_READER_PASSWORD:-querydon-reader}
        ports:
            # 5433 on the host: 5432 is used by other postgres containers
            - "${POSTGRES_PORT:-5433}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            # Runs only when the data volume is empty (first start or after `pnpm db:reset`)
            - ./db/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres-data:
